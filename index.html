<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Колодец 3D</title>
<style>
:root{
  --bg:#e7eaec; --stage:#dfe3e5; --surface:#ffffff; --surface-2:#f3f5f6; --ink:#1c2226; --muted:#5d6872; --line:#d2d8db;
  --accent:#c98200; --accent-soft:#f6e7c8; --ok:#2e7d4f; --warn:#b3261e; --steel:#2f6f9f; --violet:#6d5aa8;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --fc:"Arial Narrow","Roboto Condensed",system-ui,sans-serif; --fm:ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14171a; --stage:#1b1f23; --surface:#1f2428; --surface-2:#262c31; --ink:#e6eaec; --muted:#9aa6af; --line:#343b41;
  --accent:#f0a92a; --accent-soft:#3a2f17; --ok:#6cc792; --warn:#f2867c; --steel:#79b2dd; --violet:#a796e0; } }
:root[data-theme="dark"]{ --bg:#14171a; --stage:#1b1f23; --surface:#1f2428; --surface-2:#262c31; --ink:#e6eaec; --muted:#9aa6af; --line:#343b41;
  --accent:#f0a92a; --accent-soft:#3a2f17; --ok:#6cc792; --warn:#f2867c; --steel:#79b2dd; --violet:#a796e0; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f);-webkit-text-size-adjust:100%}
.app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.stage{position:relative;background:var(--stage);overflow:hidden;touch-action:none}
#view{position:absolute;inset:0}
#view canvas{display:block}
.top{position:absolute;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.ttl{pointer-events:auto;background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line);border-radius:10px;padding:8px 12px;backdrop-filter:blur(6px);max-width:100%}
.tl{display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:75%;min-width:0}
.qbar{display:flex;gap:6px;pointer-events:auto}
.btn.qb{min-height:34px;padding:7px 12px;font-size:13px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(6px)}
.btn.qb[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.btn.dd::after{content:'';display:inline-block;margin-left:7px;vertical-align:2px;border:4.5px solid transparent;border-top-color:currentColor;border-bottom:0}
.menu{position:absolute;z-index:6;min-width:176px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 10px 28px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:2px}
.menu[hidden]{display:none}
.mi{display:flex;align-items:center;justify-content:space-between;gap:12px;font:600 14px/1.2 var(--f);color:var(--ink);background:transparent;border:0;border-radius:8px;padding:11px 12px;text-align:left;cursor:pointer;min-height:42px}
.mi:hover,.mi:focus-visible{background:var(--surface-2);outline:0}
.mi::after{content:'';width:16px;height:16px;flex:none;border-radius:4px;border:1.5px solid var(--line)}
.mi.mq{border-top:1px solid var(--line);border-radius:0 0 8px 8px;margin-top:3px;font-weight:500;color:var(--muted)}.mi.mq::after{display:none}
.mi[aria-pressed="true"]::after{content:'✓';border-color:var(--accent);background:var(--accent);color:#1c1608;font:800 12px/16px var(--f);text-align:center}
.ttl .k{font:600 10.5px var(--fc);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ttl h1{margin:2px 0 0;font:700 21px/1.15 var(--f)} .ttl h1 b{color:var(--accent)}
.ttl .s{font-size:12.5px;color:var(--muted)}
.tools{position:absolute;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.btn{font:600 14px/1 var(--f);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:11px 13px;cursor:pointer;min-height:42px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.main{background:var(--accent);border-color:var(--accent);color:#1c1608}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.stepcard{position:absolute;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:calc(max(10px,env(safe-area-inset-bottom)) + 56px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.16);display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.stepcard[hidden]{display:none}
.inui{position:absolute;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:calc(max(10px,env(safe-area-inset-bottom)) + 56px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:0 6px 24px rgba(0,0,0,.16);display:flex;gap:10px;align-items:center;justify-content:space-between}
.inui[hidden]{display:none}
.inui .hint{font-size:13px;line-height:1.3}
.inui .nav{display:flex;gap:6px;flex:none}
.inui .vp{display:flex;gap:6px;flex:none}.inui .vp[hidden]{display:none}
@media (max-width:560px){.inui{flex-wrap:wrap}.inui .hint{flex:1 1 100%}}
.stepcard .n{font:800 22px var(--f);color:var(--accent);min-width:1.6em;text-align:center}
.stepcard b{display:block;font-size:15.5px;line-height:1.2}
.stepcard .fc{font-size:12px;color:var(--muted)}
.stepcard ul{margin:4px 0 0;padding-left:17px;font-size:13px}
.stepcard .chk{font-size:12.5px;color:var(--ok);margin-top:2px}
.stepcard .nav{display:flex;flex-direction:column;gap:6px}
.lbl{position:absolute;left:0;top:0;font:600 11.5px/1.15 var(--f);color:var(--ink);background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line);border-radius:6px;padding:3px 6px;white-space:nowrap;pointer-events:auto;cursor:pointer;max-width:40vw;overflow:hidden;text-overflow:ellipsis;user-select:none;-webkit-tap-highlight-color:transparent}
.lbl b{font-weight:650}
.lbl small{display:block;font:500 10.5px var(--fm);color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.lbl.w{white-space:normal;max-width:min(46vw,260px)}
.lbl.hi{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lbl.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 0 14px color-mix(in srgb,var(--accent) 55%,transparent);white-space:normal;max-width:min(62vw,300px);z-index:2;animation:lblGlow 1.6s ease-in-out .35s infinite}
@keyframes lblGlow{0%,100%{box-shadow:0 0 0 2px var(--accent),0 0 16px color-mix(in srgb,var(--accent) 60%,transparent)}50%{box-shadow:0 0 0 2px var(--accent),0 0 6px color-mix(in srgb,var(--accent) 30%,transparent)}}
.lbl.tp{color:#1f6fc5;border-color:#1f6fc5}
.lbl.ugv{color:#1f6fb5;border-color:#7fb3e0}
.lbl.ugvm{color:#b0177f;border-color:#e08cc6}
.lbl.lp{text-align:center;padding:2px 5px;transform-origin:50% 50%}.lbl.lp small{display:none}.lbl.lp.sel small{display:block}
.lbl.lb{color:#6b4f37;border-color:#b99c80;border-style:dashed}.lbl.lh{font-weight:500;color:var(--muted);background:transparent;border-color:transparent;pointer-events:none}
.lbl.ld{font:600 11px var(--fm);color:var(--ink);background:color-mix(in srgb,var(--surface) 82%,transparent);border-color:transparent;pointer-events:none}
.lbl.nb{border-color:var(--line);line-height:1.2}.lbl.nb small{display:block;font:500 10px var(--f);color:var(--muted)}
#leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#leaders path{fill:none;stroke:var(--muted);stroke-width:1;stroke-linejoin:round}
#leaders path.s{stroke:var(--accent);stroke-width:1.6}
#leaders circle{fill:var(--muted)} #leaders circle.s{fill:var(--accent)}
.panel{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.panel h2{font:700 15px var(--f);margin:0}
.legend{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:5px 14px;font-size:12.5px;color:var(--ink)}
.legend li{display:flex;align-items:center;gap:7px;line-height:1.2}
.legend i{flex:0 0 14px;height:14px;border-radius:4px;border:1px solid color-mix(in srgb,var(--ink) 22%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--surface-2)}
/* 0.18: изделия — карточки с чертежом в размерах (как в паспорте); нажатие — изделие подсвечивается на модели */
.kcards{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.kcard{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:6px;outline:none}
.kcard:hover,.kcard:focus-visible{border-color:var(--accent)}
.kcard.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.kcard .kh{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.3}
.kcard .kn{flex:0 0 auto;min-width:22px;height:22px;padding:0 5px;box-sizing:border-box;border-radius:11px;background:#b8650a;color:#fff;font:700 12px var(--f);display:flex;align-items:center;justify-content:center}
.kcard .kh b{font-size:14px}.kcard .kh small{display:block;color:var(--muted);font-size:11.5px}
.kcard .kdr{background:#fbfaf7;border-radius:6px;padding:4px}
.kcard svg{width:100%;height:auto;display:block}
.kcard .knote{font-size:11.5px;color:var(--muted);line-height:1.35}
.chip.per{border-color:var(--violet);color:var(--violet)} .chip.ms{border-color:var(--steel);color:var(--steel)}
dl.facts{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:0;font-variant-numeric:tabular-nums}
dl.facts dt{color:var(--muted)} dl.facts dd{margin:0;text-align:right;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th{font:600 10.5px var(--fc);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 5px;border-bottom:1px solid var(--line)}
td{padding:5px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
tr.sum td{font-weight:700;background:var(--surface-2)} tr.sum td.ok{color:var(--ok)}
.note{font-size:12px;color:var(--muted)}
.msg{font-size:13px;border-radius:8px;padding:8px 10px;background:var(--surface-2)}
.chip.ugv{color:#1f6fb5;border-color:#9cc7ec}
.msg.bad{color:var(--warn)}
.sheetbtn{display:none}
.sheethead{display:none}
.land{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.land .card{max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center}
.land h1{font:700 22px var(--f);margin:0 0 8px}
.land p{color:var(--muted);margin:0 0 16px}
.err{color:var(--warn)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .panel{position:fixed;left:0;right:0;bottom:0;max-height:78vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .25s ease;z-index:5;padding-bottom:max(16px,env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.2)}
  .panel.open{transform:none}
  .sheetbtn{display:inline-block}
  .sheethead{display:flex;align-items:center;gap:10px;position:sticky;top:-16px;z-index:2;margin:-16px -16px 0;padding:14px 12px 10px 16px;background:var(--surface);border-bottom:1px solid var(--line);border-radius:16px 16px 0 0;touch-action:none}
  .sheethead .grip{position:absolute;left:50%;top:6px;width:42px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
  .sheethead b{flex:1;font-size:15px}
  .ttl h1{font-size:18px}
  .btn{padding:10px 11px;font-size:13.5px}
}
.stepcard .prog{position:absolute;left:12px;right:12px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--line);overflow:hidden}
.stepcard .prog i{display:block;height:100%;width:0;background:var(--accent)}
.stepcard.playing{grid-template-columns:auto 1fr}.stepcard.playing .nav{display:none}
.tools.playing>.btn:not(.an){display:none}.tools:not(.playing)>.an{display:none}
.btn.an{min-width:48px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <section class="stage" aria-label="3D-модель колодца">
    <div id="view"></div>
    <svg id="leaders" aria-hidden="true"></svg>
    <div id="labels"></div>
    <div class="top"><div class="tl"><div class="ttl"><div class="k" id="kk">Колодец 3D · паспорт сборки</div><h1 id="ttl">Колодец</h1><div class="s" id="sub"></div></div>
        <div class="qbar"><button class="btn qb" id="bLbl" aria-pressed="true">Подписи</button><button class="btn qb" id="bReset" title="Вернуть исходный вид">⟲ Вид</button></div></div>
      <button class="btn" id="bTheme" style="pointer-events:auto" aria-label="Светлая или тёмная тема">◐</button></div>
    <div class="stepcard" id="card" hidden>
      <div class="prog" id="prog" hidden><i id="progi"></i></div>
      <div class="n" id="cn">1</div>
      <div><b id="ct"></b><div class="fc" id="cf"></div><ul id="cu"></ul><div class="chk" id="cc"></div></div>
      <div class="nav"><button class="btn main" id="next" aria-label="Следующий шаг">▶</button><button class="btn" id="prev" aria-label="Предыдущий шаг">◀</button></div>
    </div>
    <div class="inui" id="inui" hidden><div class="hint" id="inHint"></div>
      <div class="vp" id="inVp" hidden><button class="btn" id="vpH" aria-pressed="true">Люк</button><button class="btn" id="vpC" aria-pressed="false">Углы</button><button class="btn" id="vpT" aria-pressed="false">Сверху</button></div>
      <div class="nav"><button class="btn" id="inUp" aria-label="Выше по скобам">▲</button><button class="btn" id="inDn" aria-label="Ниже по скобам">▼</button></div></div>
    <div class="menu" id="mView" role="menu" aria-label="Вид" hidden>
      <button class="mi" id="bCut" aria-pressed="false">Разрез</button>
      <button class="mi" id="bExp" aria-pressed="false">Разобрать</button>
      <button class="mi" id="bIn" aria-pressed="false">Изнутри</button>
      <button class="mi" id="bLay" aria-pressed="false" hidden>Раскладка</button>
    </div>
    <div class="menu" id="mShow" role="menu" aria-label="Показать" hidden>
      <button class="mi" id="bCoat" aria-pressed="false">Гидроизоляция</button>
      <button class="mi" id="bSurf" aria-pressed="false">Покрытие</button>
      <button class="mi mq" id="bQ" title="Уровень графики: авто (по мощности телефона), высокое, среднее, низкое">Графика: авто</button>
    </div>
    <div class="tools">
      <button class="btn main" id="bPlay">▶ Сборка</button>
      <button class="btn" id="bSteps" aria-pressed="false" hidden>Как собрать</button>
      <button class="btn dd" id="bView" aria-haspopup="menu" aria-expanded="false" aria-pressed="false">Вид</button>
      <button class="btn dd" id="bShow" aria-haspopup="menu" aria-expanded="false" aria-pressed="false">Показать</button>
      <button class="btn sheetbtn" id="bInfo">Данные</button>
      <button class="btn main an" id="aPlay" aria-label="Пауза">❚❚</button>
      <button class="btn an" id="aPrev" aria-label="Шаг назад">⏮</button>
      <button class="btn an" id="aNext" aria-label="Следующий шаг">⏭</button>
      <button class="btn an" id="aSpd" aria-label="Скорость">1×</button>
      <button class="btn an" id="aStop" aria-label="Закончить">✕</button>
    </div>
  </section>
  <aside class="panel" id="panel" aria-label="Данные колодца"><div class="sheethead" id="sheetHead"><span class="grip"></span><b>Данные колодца</b><button class="btn" id="bClose" aria-label="Закрыть данные">✕ Закрыть</button></div><div id="panelBody"></div></aside>
</div>
<div class="land" id="land" hidden><div class="card"><h1>Колодец 3D</h1><p id="landTxt">Эта страница показывает 3D-модель колодца. Откройте её по QR-коду из паспорта сборки.</p><button class="btn main" id="bDemo">Показать пример</button></div></div>

<script src="vendor/OrbitControls.js"></script>
<script src="core.js"></script>

<script>
"use strict";
const DEMO = 'k1TZFNTiQxDIWvgrx-WHZSTiXdJ-AMiAUSe3ZsJiMhVjMbEGIHgubnAr1BIARzBudGo1RTTStSFD87fl_iX3RGCwUd0-JQoFmOQKe0IF-1c3_3T39t5wQ6ocUhKUFAfutP_rKvhIElQtkQRabMDYH8uW83vvY3_-dfBGENEBaDQHiA9HsZkSOEc4R1OY29zkC-8ns12tiocfk5JkKEgtRXvlLbDx1Huzb1T72NISTOI5RTRpi9c4GwFUyUNJtUrcVkORvVWFVkG6eqNSVZbt16nGXpj_7a_rTrduEfvt7zN1-3v_7eLvzL1-2qalXjOHUZOfYwTj0fUo212921S__Y8-ee0vRDU4OIVA07RGpdSVlqLrtgW9nKLuA4y_r9rA7QxTxIDWXGsLxRRiEUZJA_-C2BDg4IGrgoVDkOUGOLGDiHaW5hGrV8r9DPHDO0fzMEcRrvpiCyHf3-Dw';
const $ = s => document.querySelector(s);
const {fmt, sgn, esc, N, S} = KC;
let elKeys = new Set(), stepExp = false, inside = null, showCoat = false, showSurf = false, M, SC, renderer, camera, controls, steps, stepIdx = -1, cut = false, expT = 0, expTarget = 0, showLbl = true, lblEls = [], needs = true, lay = null;

function theme() { try { const t = localStorage.getItem('kolsb-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {} }
theme();
$('#bTheme').onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); const n = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = n; try { localStorage.setItem('kolsb-theme', n); } catch (e) {} setBg(); needs = true; };
function setBg() { if (renderer) renderer.setClearColor(new THREE.Color(inside ? '#bcd8ee' : (getComputedStyle(document.documentElement).getPropertyValue('--stage').trim() || '#dfe3e5')), 1); needs = true; }

// водопроводные колодцы (В1): модель в осях колодца, сцена повёрнута на угол магистрали
const VV = KC.VV, isVV = () => !!(M && M.vv);
const wpt = (x, y) => isVV() ? VV.toW(M, x, y) : [x, y];
async function start(payload) {
  const vv = payload.slice(0, 2) === 'v1';
  const {w, angsDeg, obj} = vv ? await VV.unpack(payload) : await KC.unpack(payload);
  M = vv ? VV.model(w, angsDeg.map(d => d * Math.PI / 180)) : KC.model(w, angsDeg.map(d => d * Math.PI / 180));
  steps = vv ? VV.stepsOf(M) : KC.stepsOf(M); elKeys = new Set(M.els.filter(e => e.kind !== 'ЛЮК' && e.kind !== 'ПД' && e.kind !== 'РШ').map(e => e.key));
  $('#land').hidden = true; $('#app').hidden = false;
  document.title = `Колодец №${w.nom} — 3D`;
  $('#ttl').innerHTML = `Колодец <b>№${esc(w.nom)}</b>`;
  $('#sub').textContent = (vv ? ['В1', M.rect ? `${S(w, 'pk')} ${N(w, 'A')}×${N(w, 'B')}` : 'Ø' + Math.round(M.D * 1000), (S(w, 'placeName') || '').toLowerCase(), 'люк ' + S(w, 'hatch') + (M.hatches.length > 1 ? ' ×' + M.hatches.length : '')]
    : [S(w, 'mark'), 'Ø' + Math.round(M.D * 1000), (S(w, 'placeName') || '').toLowerCase(), 'люк ' + S(w, 'hatch')]).filter(Boolean).join(' · ');
  if (obj) $('#kk').textContent = obj;
  initGL(); buildPanel(w, obj); frame();

      ${M.rows.map(r => `<tr><td>${r.pos}</td><td>${esc(r.mark)}</td><td>${esc(dimsOf(r.mark))}</td><td class="r">${r.q}</td><td class="r">${Math.round(r.q * r.kg)}</td></tr>`).join('')}</tbody></table>
      <div class="note">Цифра перед маркой на подписях модели — позиция в этой таблице (как «Поз.» в паспорте).</div></div>

    ${M.seis ? `<div><h2>Сейсмика: МС</h2><table><tbody>${[['ring', 'Швы колец'], ['pp', 'Кольцо — плита'], ['p10', 'Плита — КС10'], ['g10', 'Швы КС10'], ['p10t', 'КС10 — ПП10'], ['ppg', 'Плита — горловина'], ['gorl', 'Швы горловины'], ['gko', 'КС7 — КО6']].map(([k, t]) => { const l = M.seams.filter(s => s.kind === k); return l.length ? `<tr><td>${t}</td><td class="r">${l[0].mark} × ${l[0].n}${l.length > 1 ? ` × ${l.length} шв.` : ''}</td></tr>` : ''; }).join('')}
      ${M.zamE ? `<tr><td>Стык с днищем</td><td class="r">без МС: замок из бетона В12,5 · галтель ${mm(M.zamE.z1 - M.zamE.z0)}×${mm(M.zamE.rout - M.zamE.rin)} · ${fmt(M.zamE.vol, 3)} м³</td></tr>` : ''}${N(w, 'setR') ? `<tr><td>Сетка в стенах</td><td class="r">С3Вр1-150 · ${fmt(N(w, 'setR'))} кг</td></tr>` : ''}</tbody></table>
      <div class="note">ТПР 901-09-11.84, Альбом VI.88 (АС-3, АС-5): МС-1…4 — Н-образные, МС-5…8 — h-образные.</div></div>` : ''}
    ${M.rect ? `<div><h2>Перекрытие ${esc(M.pk)}</h2><table><tbody><tr><td>Плит</td><td class="r">${M.plates.length}${M.beams.length ? ` · балок Б8 ${M.beams.length}` : ''}</td></tr>
      <tr><td>Раскладка</td><td class="r">по плану Альбома IV (АС-8…12)</td></tr>${M.lay.type === 'S' ? `<tr><td>Ширины плит / длина камеры</td><td class="r">${mm(M.lay.sum)} / ${N(w, 'A')} мм</td></tr>` : ''}</tbody></table></div>` : ''}
    <div><h2>Основание и гидроизоляция</h2><table><tbody>
      <tr><td>Основание (${esc(M.gruntName.split(' — ')[0])})</td><td class="r">${M.base.map(b => esc(b.n)).join('<br>')}${M.zamok ? '<br>водоупорный замок' : ''}</td></tr>
      <tr><td>Снаружи</td><td class="r">${M.okl ? `оклеечная: гидроизол 2–3 слоя на мастике, до ${sgn(M.zOkl - M.zg)} м, ${fmt(N(w, 'gout'))} м²` : M.gzOld ? `горячий битум, ${fmt(N(w, 'gout'))} м²` : M.gzOut ? `горячий битум ${KC.gzWhy(M).zone}, ${fmt(N(w, 'gout'))} м²` : 'не нужна — грунт сухой'}</td></tr>
      <tr><td>Внутри</td><td class="r">${N(w, 'gin') ? (M.pII && !M.okl ? `горячий битум (просадочные II), ${fmt(N(w, 'gin'))} м²` : `${M.gzOld ? '' : 'Битрон-11, '}${fmt(N(w, 'gin'))} м²`) : 'не нужна'}</td></tr>
      ${M.tapes.length ? `<tr><td>Лента на стыки</td><td class="r">гидроизол ГИ-Г${M.tapeN > 1 ? ' в ' + M.tapeN + ' слоя' : ''} · ${M.tapes.length} стыков${M.gzAll || M.okl ? '' : ' в зоне воды'} · ${fmt(N(w, 'lenta'))} м²</td></tr>` : ''}
      ${M.ugv !== null ? `<tr><td>Грунтовые воды</td><td class="r">${M.ugv2 ? `ожидаемый (макс.) ${fmt(M.ugv)} м, установившийся ${fmt(M.ugv0)} м` : `УГВ ${fmt(M.ugv)} м от земли`}${M.wetV ? '' : ' — ниже колодца'}</td></tr>` : ''}${M.beton ? `<tr><td>Бетон</td><td class="r">${esc(M.beton)}</td></tr>` : ''}
      ${M.gil ? `<tr><td>Гильзы (стальной футляр)</td><td class="r">${[...new Set(M.pipes.filter(p => p.sl).map(p => `Ø${p.gD}×${p.gSmm}`))].join(', ')} · L ${mm(M.gilL)} · ${M.gil} шт.</td></tr>` : ''}
      ${M.hatches.some(g => g.nab) ? `<tr><td>Набетонка горловины</td><td class="r">М100 · h ${mm(M.nabH)}${nG > 1 ? ' ×' + nG : ''} · ${fmt(M.nabV, 3)} м³</td></tr>` : ''}</tbody></table>

    ${legendHtml()}
    <div class="msg ${msgs.length ? 'bad' : ''}">Проверка: ${msgs.length ? msgs.map(esc).join('; ') : 'ОК'}</div>
    <div class="note">Модель построена по данным таблицы «Авто Колодцы В1», переданным в ссылке. Демонстрационная версия KOLSB.</div>`;
}
function buildPanel(w, obj) {
  KSEL.clear();
  if (isVV()) return buildPanelVV(w);
  const mm = v => Math.round(v * 1000), nR = M.rings.length;
  const rsum = M.rings.reduce((s, r) => s + (r.z1 - r.z0) + KC.SEAM, 0), gW = M.ztop - M.V;
  const chips = [`Ø${Math.round(M.D * 1000)}`, `Ду${Math.round(M.Du * 1000)}`, KC.PLACE[M.place] || '', 'люк ' + S(w, 'hatch')].filter(Boolean).map(c => `<span class="chip">${esc(c)}</span>`)
    .concat(M.per ? [`<span class="chip per">перепадный ${fmt(N(w, 'drop'))} м</span>`] : M.sliv ? [`<span class="chip per">перепад ${fmt(N(w, 'drop'))} м — слив</span>`] : []).concat(M.seis ? [`<span class="chip ms">сейсмика ${esc(S(w, 'seism'))} б.</span>`] : [])
    .concat(M.nabE ? ['<span class="chip">набетонка</span>'] : []).concat(M.okl ? ['<span class="chip ugv">вода выше перекрытия</span>'] : []);
  const ringGroups = []; M.rings.slice().reverse().forEach(r => { const g = ringGroups[ringGroups.length - 1]; if (g && g.mark === r.mark) g.n++; else ringGroups.push({mark: r.mark, n: 1, h: r.z1 - r.z0}); });
  const dimsOf = m => { const d = M.dims[m]; if (!d) return ''; const a = d.din ? `Ø${d.din}/` : ''; const b = /×/.test(d.dout) ? d.dout : (d.din ? d.dout : 'Ø' + d.dout); return `${a}${b}×${d.h}`; };
  $('#panelBody').innerHTML = `
    <div class="chips">${chips.join('')}</div>
    <dl class="facts"><dt>Глубина до лотка${M.per || M.sliv ? ' выпуска' : ''}</dt><dd>${fmt(N(w, 'H'))} м</dd><dt>Рабочая часть</dt><dd>${fmt(M.V)} м</dd><dt>Горловина с плитой</dt><dd>${fmt(gW)} м</dd>
      <dt>Верх люка</dt><dd>${sgn(M.ztop - M.zg)} м от земли</dd><dt>Самый тяжёлый</dt><dd>${M.heavy ? esc(M.heavy.mark) + ' · ' + fmt(M.heavy.kg / 1000) + ' т' : '—'}</dd><dt>Масса сборных и люка</dt><dd>${fmt(M.total / 1000)} т</dd></dl>
    <div><h2>Высоты складываются так</h2><table><tbody>
      ${ringGroups.map(g => `<tr><td>${esc(g.mark)}${g.n > 1 ? ' ×' + g.n : ''}</td><td class="r">${g.n > 1 ? g.n + ' × ' : ''}(${mm(g.h)} + 10)</td></tr>`).join('')}
      <tr class="sum"><td>Рабочая часть</td><td class="r ok">${mm(rsum)} мм ✓</td></tr>
      ${M.nabE ? `<tr><td>в т.ч. набетонка М100</td><td class="r">${mm(M.nabE.z1 - M.nabE.z0)} мм · ${fmt(M.nabV, 3)} м³</td></tr>` : ''}${M.nabJ > .0005 ? `<tr><td>в т.ч. шов под КО6 (добор)</td><td class="r">10 + ${mm(M.nabJ)} мм</td></tr>` : ''}
      <tr class="sum"><td>Горловина с плитой и люком</td><td class="r ok">${mm(gW)} мм ✓</td></tr></tbody></table>
      <div class="note">Шов на растворе — 10 мм. Суммы совпадают с расчётом «Авто Колодцев».</div></div>
    <div><h2>Элементы</h2><table><thead><tr><th>Поз.</th><th>Марка</th><th>Размеры, мм</th><th class="r">Шт.</th><th class="r">кг</th></tr></thead><tbody>
      ${M.rows.map(r => `<tr><td>${r.pos}</td><td>${esc(r.mark)}</td><td>${esc(dimsOf(r.mark) || (/^Решётка/.test(r.mark) ? 'рамка 620×620' : ''))}</td><td class="r">${r.q}</td><td class="r">${Math.round(r.q * r.kg)}</td></tr>`).join('')}</tbody></table>
      <div class="note">Цифра перед маркой на подписях модели — позиция в этой таблице (как «Поз.» в паспорте).</div></div>
    ${cardsPanelHtml()}
    ${M.seis ? `<div><h2>Сейсмика: МС</h2><table><tbody>${[['ring', 'Швы колец'], ['pp', 'Под ПП'], ['ppg', 'ПП — горловина'], ['gorl', 'Швы горловины']].map(([k, t]) => { const l = M.seams.filter(s => s.kind === k); return l.length ? `<tr><td>${t}</td><td class="r">${l[0].mark} × ${l[0].n}${l.length > 1 ? ` × ${l.length} шв.` : ''}</td></tr>` : ''; }).join('')}
      <tr><td>Шов с плитой днища</td><td class="r">обойма — бетон лотка</td></tr></tbody></table></div>` : ''}
    <div><h2>Основание и гидроизоляция</h2><table><tbody>
      <tr><td>Основание (грунт ${M.grunt})</td><td class="r">${M.base.map(b => esc(b.n)).join('<br>')}${M.zamok ? '<br>водоупорный замок 600×400' : ''}</td></tr>
      <tr><td>Снаружи</td><td class="r">${M.okl ? `оклеечная: гидроизол 2–3 слоя на мастике, до ${sgn(M.zOkl - M.zg)} м` : M.gzOld ? 'битумная мастика' : M.gzOut ? `горячий битум ${KC.gzWhy(M).zone}` : 'не нужна — грунт сухой'}</td></tr>
      ${!M.gzOld && N(w, 'gin') ? `<tr><td>Внутри</td><td class="r">${M.pII && !M.okl ? 'горячий битум (просадочные II)' : 'Битрон-11'}, ${fmt(N(w, 'gin'))} м²</td></tr>` : ''}
      ${M.ugv !== null ? `<tr><td>Грунтовые воды</td><td class="r">${M.ugv2 ? `ожидаемый (макс.) ${fmt(M.ugv)} м, установившийся ${fmt(M.ugv0)} м` : `УГВ ${fmt(M.ugv)} м от земли`}${M.wetV ? '' : ' — ниже колодца'}</td></tr>` : ''}${M.beton ? `<tr><td>Бетон</td><td class="r">${esc(M.beton)}</td></tr>` : ''}
      ${M.tapes.length ? `<tr><td>Лента на стыки</td><td class="r">гидроизол ГИ-Г${M.tapeN > 1 ? ' в ' + M.tapeN + ' слоя' : ''} · ${M.tapes.length} стыков${M.gzAll || M.okl ? '' : ' в зоне воды'} · полоса ${fmt(M.tapeW)} м · ${fmt(N(w, 'lenta'))} м²</td></tr>` : '<tr><td>Лента на стыки</td><td class="r">не нужна — стыки выше зоны воды</td></tr>'}</tbody></table>
      <div class="note">Основание — по ТПР 902-09-22.84, Альбом II, лист АС-1.</div></div>
    ${legendHtml()}
    <div class="msg ${S(w, 'msg') === 'ОК' ? '' : 'bad'}">Проверка расчёта: ${esc(S(w, 'msg'))}</div>
    <div class="note">Модель построена по данным таблицы «Авто Колодцы», переданным в ссылке. Демонстрационная версия KOLSB.</div>`;
}
(async () => {
  const h = location.hash.slice(1);
  $('#bDemo').onclick = () => { location.hash = DEMO; location.reload(); };
  if (!h) { $('#land').hidden = false; return; }
  try { await start(h); } catch (e) { $('#land').hidden = false; $('#landTxt').innerHTML = `<span class="err">Не удалось прочитать данные колодца из ссылки (${esc(e.message)}).</span> Попробуйте отсканировать QR-код ещё раз.`; console.error(e); }
})();
